   one ratio per role, deliberately chosen, but computed values land fractional. */

body{background:#fdfcfa;color:#1a1714;font-family:system-ui;font-size:15px;line-height:1.6;padding:32px}
h1{font-size:25px;line-height:1.3;font-weight:600;margin-bottom:24px}
p{margin-bottom:16px}
:focus-visible{outline:2px solid #b45309}
</style></head><body><h1>Ratio-based ramp</h1><p>Body copy set at a 1.6 ratio, the way most token systems express it.</p></body></html>
